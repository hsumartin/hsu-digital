<text x="644" y="466" font-size="14" font-weight="700" letter-spacing="1.4" fill="#2B6895">04 / MÖGLICHE VERÄNDERUNG</text>
<text x="644" y="502" font-size="23" font-weight="700" fill="#0E1116">Veränderte Voraussetzungen</text>
<text x="644" y="532" font-size="17" fill="#5D6771">Neue Interessen, Kenntnisse, Perspektiven</text>
<rect x="62" y="428" width="516" height="127" rx="13" fill="#FCFBF8" stroke="#3F7FAE" stroke-width="2"/>
<rect x="62" y="428" width="516" height="6" rx="3" fill="#3F7FAE"/>
