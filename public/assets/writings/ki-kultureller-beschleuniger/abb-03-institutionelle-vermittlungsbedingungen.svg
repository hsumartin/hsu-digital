<text x="600.00" y="140.00" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Bildung</text>
<text x="600.00" y="169.00" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Befähigung</text>
<text x="600.00" y="209.00" text-anchor="middle" font-size="16.5" fill="#343B48">Lernen, Urteilsfähigkeit</text>
<text x="600.00" y="237.00" text-anchor="middle" font-size="16.5" fill="#343B48">und kritische Nutzung</text>
<circle cx="916.70" cy="407.10" r="128" fill="url(#card)" stroke="#BFD1DD" stroke-width="2.2"/>
<text x="916.70" y="370.10" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Wissenschaftliche</text>
<text x="916.70" y="399.10" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Kritik</text>
<text x="916.70" y="439.10" text-anchor="middle" font-size="16.5" fill="#343B48">Öffentliche Kritik,</text>
<text x="916.70" y="467.10" text-anchor="middle" font-size="16.5" fill="#343B48">Replikation, Widerspruch</text>
<circle cx="795.73" cy="779.40" r="128" fill="url(#card)" stroke="#BFD1DD" stroke-width="2.2"/>
<text x="795.73" y="742.40" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Institutionelle</text>
<text x="795.73" y="771.40" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Anreize</text>
<text x="795.73" y="811.40" text-anchor="middle" font-size="16.5" fill="#343B48">Bewertung, Finanzierung</text>
<text x="795.73" y="839.40" text-anchor="middle" font-size="16.5" fill="#343B48">und Forschungsprioritäten</text>
<circle cx="404.27" cy="779.40" r="128" fill="url(#card)" stroke="#BFD1DD" stroke-width="2.2"/>
<text x="404.27" y="742.40" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Digitale</text>
<text x="404.27" y="771.40" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Souveränität</text>
<text x="404.27" y="811.40" text-anchor="middle" font-size="16.5" fill="#343B48">Datenzugang, Wechsel</text>
<text x="404.27" y="839.40" text-anchor="middle" font-size="16.5" fill="#343B48">und Handlungsrechte</text>
<circle cx="283.30" cy="407.10" r="128" fill="url(#card)" stroke="#BFD1DD" stroke-width="2.2"/>
<text x="283.30" y="370.10" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">Qualitäts-</text>
<text x="283.30" y="399.10" text-anchor="middle" font-size="22" font-weight="650" fill="#183B55">sicherung</text>
<text x="283.30" y="439.10" text-anchor="middle" font-size="16.5" fill="#343B48">Prüfverfahren,</text>
