nt-weight="600" fill="#183B55">→ Überprüfte Erkenntnis</text><text x="351" y="486" font-size="19" fill="#343B48">Aus offenen Fragen werden prüfbare</text><text x="351" y="512" font-size="19" fill="#343B48">Aussagen durch geeignete Verfahren.</text><path d="M 104 487 V 615" fill="none" stroke="#2B6895" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="580" width="900" height="166" rx="22" fill="url(#card)" stroke="#CBD6DC" stroke-width="1.4"/><rect x="190" y="609" width="116" height="108" rx="28" fill="#D5E2EB" fill-opacity=".7"/><circle cx="104" cy="662" r="39" fill="url(#blue)"/><text x="104" y="674" fill="white" font-size="33" font-weight="500" text-anchor="middle">3</text><path d="M 222 687 L 258 640 L 285 683" stroke="#183B55" stroke-width="3" fill="none"/><circle cx="222" cy="687" r="10" fill="#F8F7F3" stroke="#183B55" stroke-width="3"/><circle cx="258" cy="640" r="10" fill="#F8F7F3" stroke="#183B55" stroke-width="3"/><circle cx="285" cy="683" r="10" fill="#F8F7F3" stroke="#183B55" stroke-width="3"/><text x="350" y="633" font-size="28" font-weight="600" fill="#183B55">Individuelle Ergebnisse</text><text x="350" y="666" font-size="28" font-weight="600" fill="#183B55">→ Kollektives Wissen</text><text x="351" y="701" font-size="19" fill="#343B48">Ergebnisse werden zugänglich, kritisierbar</text><text x="351" y="727" font-size="19" fill="#343B48">und von anderen weiterverwendbar.</text><path d="M 104 702 V 830" fill="none" stroke="#2B6895" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="795" width="900" height="166" rx="22" fill="url(#card)" stroke="#CBD6DC" stroke-width="1.4"/><rect x="190" y="824" width="116" height="108" rx="28" fill="#D5E2EB" fill-opacity=".7"/><circle cx="104" cy="877" r="39" fill="url(#blue)"/><text x="104" y="889" fill="white" font-size="33" font-weight="500" text-anchor="middle">4</text><circle cx="233" cy="863" r="13" fill="none" stroke="#183B55" stroke-width="3"/><circle cx="270" cy="863" r="13" fill="none" stroke="#