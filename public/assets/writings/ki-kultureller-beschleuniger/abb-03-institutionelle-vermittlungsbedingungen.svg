<text x="600" y="515" font-size="22" font-weight="500" text-anchor="middle" fill="#183B55">und kollektive</text>
<text x="600" y="548" font-size="22" font-weight="500" text-anchor="middle" fill="#183B55">Nutzbarkeit</text>
<path d="M 549 576 H 651" stroke="#C9A94B" stroke-width="3"/>
<text x="600" y="1005" font-size="18" text-anchor="middle" fill="#343B48">Konzeptionelle Vermittlungsbedingungen, keine empirisch bestätigte Wirkungskette</text>
