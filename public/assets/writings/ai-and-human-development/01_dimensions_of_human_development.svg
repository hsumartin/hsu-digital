<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Three dimensions of human developmental possibilities</title>
<desc id="d">Three equally important areas: independently acquired competence, tool-mediated capability through tools, and new interests and developmental directions. They may interact, but do not have to. No hierarchy or automatic effect is implied.</desc>
<rect width="1200" height="650" fill="#F0EEE8"/>
<rect x="54" y="48" width="5" height="44" rx="2" fill="#C9A94B"/>
<text x="78" y="66" font-size="16" letter-spacing="3" font-weight="700" fill="#2B6895">FIGURE 01  /  CHAPTERS 3–4</text>
<text x="78" y="104" font-size="31" font-weight="700" fill="#0E1116">Three dimensions of human possibilities</text>
<text x="78" y="141" font-size="18" fill="#5D6771">Different effects — without automatic equivalence</text>
<g>
<rect x="64" y="202" width="338" height="279" rx="14" fill="#FCFBF8" stroke="#CBD3D7" stroke-width="2"/>
<rect x="64" y="202" width="338" height="7" rx="3" fill="#2B6895"/>
<text x="88" y="253" font-size="15" font-weight="700" letter-spacing="1.6" fill="#2B6895">01 / INDEPENDENT</text>
<text x="88" y="304" font-size="27" font-weight="700" fill="#0E1116">Personal</text>
<text x="88" y="340" font-size="27" font-weight="700" fill="#0E1116">competence</text>
<path d="M88 369 H376" stroke="#CBD3D7" stroke-width="1.6"/>
<text x="88" y="402" font-size="18" fill="#5D6771">Self-acquired knowledge</text>
<text x="88" y="432" font-size="18" fill="#5D6771">and one's own abilities</text>
</g>
<g>
<rect x="431" y="202" width="338" height="279" rx="14" fill="#FCFBF8" stroke="#CBD3D7" stroke-width="2"/>
<rect x="431" y="202" width="338" height="7" rx="3" fill="#3F7FAE"/>
<text x="455" y="253" font-size="15" font-weight="700" letter-spacing="1.6" fill="#2B6895">02 / TOOL-MEDIATED</text>
<text x="455" y="304" font-size="27" font-weight="700" fill="#0E1116">Tool-mediated</text>
<text x="455" y="340" font-size="27" font-weight="700" fill="#0E1116">capability</text>
<path d="M455 369 H743" stroke="#CBD3D7" stroke-width="1.6"/>
<text x="455" y="402" font-size="18" fill="#5D6771">Scope for action made</text>
<text x="455" y="432" font-size="18" fill="#5D6771">accessible through AI</text>
</g>
<g>
<rect x="798" y="202" width="338" height="279" rx="14" fill="#FCFBF8" stroke="#CBD3D7" stroke-width="2"/>
<rect x="798" y="202" width="338" height="7" rx="3" fill="#C9A94B"/>
<text x="822" y="253" font-size="15" font-weight="700" letter-spacing="1.6" fill="#2B6895">03 / DEVELOPMENTALLY OPEN</text>
<text x="822" y="304" font-size="27" font-weight="700" fill="#0E1116">New interests</text>
<text x="822" y="340" font-size="25" font-weight="700" fill="#0E1116">and perspectives</text>
<path d="M822 369 H1110" stroke="#CBD3D7" stroke-width="1.6"/>
<text x="822" y="402" font-size="18" fill="#5D6771">New questions, goals, and</text>
<text x="822" y="432" font-size="18" fill="#5D6771">developmental directions</text>
</g>
<path d="M402 342 H431 M769 342 H798" stroke="#5A97C4" stroke-width="2" stroke-dasharray="4 9"/>
<rect x="64" y="520" width="1072" height="77" rx="10" fill="#2B6895" fill-opacity="0.07" stroke="#2B6895" stroke-opacity="0.22"/>
<rect x="83" y="541" width="4" height="35" fill="#C9A94B"/>
<text x="106" y="553" font-size="18" font-weight="700" fill="#0E1116">These dimensions may influence one another.</text>
<text x="106" y="580" font-size="17" fill="#5D6771">They are neither equivalent nor necessarily connected.</text>
<text x="65" y="629" font-size="13" fill="#5D6771">Conceptual distinction from the article · not a quantitative or causal evidence display</text>
</svg>
