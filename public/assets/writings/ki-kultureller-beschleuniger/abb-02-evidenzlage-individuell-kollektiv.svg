</defs><g font-family="Inter, Arial, Helvetica, sans-serif"><path d="M 85 74 H 1115" stroke="#C9C7C1" stroke-width="1"/><path d="M 85 80 H 1115" stroke="#C9A94B" stroke-opacity=".35" stroke-width="1.5"/><rect x="85" y="140" width="320" height="590" rx="26" fill="url(#card)" stroke="#C9D5DD" stroke-width="1.5"/><rect x="85" y="140" width="320" height="11" rx="5" fill="#C9A94B"/><circle cx="142" cy="225" r="24" fill="#C9A94B" opacity=".9"/><circle cx="142" cy="225" r="9" fill="white" opacity=".9"/><text x="117" y="305" font-size="24" fill="#183B55" font-weight="600">Individuelle Leistung</text><text x="117" y="346" font-size="17" fill="#343B48">Befunde zu bestimmten Aufgaben</text><path d="M 117 378 H 373" stroke="#C9C7C1" stroke-opacity=".9"/><text x="117" y="421" font-size="19" fill="#343B48">Unterstützung kann Ergebnisse</text><text x="117" y="458" font-size="19" fill="#343B48">verbessern. Der Nutzen hängt</text><text x="117" y="495" font-size="19" fill="#343B48">von Aufgabe und Bewertung ab.</text><rect x="116" y="606" width="258" height="62" rx="13" fill="#C9A94B" opacity=".12"/><text x="131" y="644" font-size="18" fill="#183B55" font-weight="600">unterstützende Befunde</text><rect x="430" y="140" width="320" height="590" rx="26" fill="url(#card)" stroke="#C9D5DD" stroke-width="1.5"/><rect x="430" y="140" width="320" height="11" rx="5" fill="#3F7FAE"/><circle cx="487" cy="225" r="24" fill="#3F7FAE" opacity=".9"/><circle cx="487" cy="225" r="9" fill="white" opacity=".9"/><text x="462" y="305" font-size="24" fill="#183B55" font-weight="600">Kreative Vielfalt</text><text x="462" y="346" font-size="17" fill="#343B48">Gegenläufige Experimente</text><path d="M 462 378 H 718" stroke="#C9C7C1" stroke-opacity=".9"/><text x="462" y="421" font-size="19" fill="#343B48">Teils grössere Vielfalt,</text><text x="462" y="458" font-size="19" fill="#343B48">teils Angleichung. Interaktion,</text><text x="462" y="495" font-size="19" fill="#343B48">Anreize und Messung zählen.</text><rect x="461" y="606" width="258" height="62" rx="13" fill="#3F7FAE" opacity=".12"/><text x="476" y="644" font-size="18" fill="#183B55" font-weight="600">kontextabhängig</text><rect x="775" y="140" width="320" height="590" rx="26" fill="url(#card)" stroke="#C9D5DD" stroke-width="1.5"/><rect x="775" y="140" width="320" height="11" rx="5" fill="#183B55"/><circle cx="832" cy="225" r="24" fill="#183B55" opacity=".9"/><circle cx="832" cy="225" r="9" fill="white" opacity=".9"/><text x="807" y="305" font-size="24" fill="#183B55" font-weight="600">Kollektives Wissen</text><text x="807" y="346" font-size="17" fill="#343B48">Offener Übergang</text><path d="M 807 378 H 1063" stroke="#C9C7C1" stroke-opacity=".9"/><text x="807" y="421" font-size="19" fill="#343B48">Ähnliche Texte sind kein</text><text x="807" y="458" font-size="19" fill="#343B48">Mass für wissenschaftliches</text><text x="807" y="495" font-size="19" fill="#343B48">Wissen oder</text><text x="807" y="532" font-size="19" fill="#343B48">gesellschaftlichen Wert.</text><rect x="806" y="606" width="258" height="62" rx="13" fill="#183B55" opacity=".12"/><text x="821" y="644" font-size="18" fill="#183B55" font-weight="600">nicht allgemein belegt</text><path d="M 405 427 H 426 M 750 427 H 771" stroke="#3F7FAE" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 7"/><rect x="115" y="793" width="975" height="82" rx="13" fill="#DDE8EF" fill-opacity=".48" stroke="#C9D5DD"/><text x="143" y="826" font-size="18" fill="#183B55" font-weight="600">Lesart:</text><text x="225" y="826" font-size="18" fill="#343B48">Keine gemeinsame Effektgrösse. Unterschiedliche Studien, Aufgaben und Messgrössen.</text><text x="143" y="855" font-size="18" fill="#343B48">Die Grafik ordnet Aussagen qualitativ ein und bildet keine statistische Metaanalyse ab.</text></g></svg>