<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="t d"><title id="t">abb-02-evidenzlage-individuell-kollektiv.svg</title><desc id="d">Konzeptionelles Whitepaper-Diagramm mit transparentem äusserem Hintergrund.</desc><defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7F3" stop-opacity=".99"/><stop offset="1" stop-color="#E9EDF0" stop-opacity=".90"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5A97C4"/><stop offset="1" stop-color="#183B55"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8BB6A"/><stop offset="1" stop-color="#A88E3D"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#BFD8EA" stop-opacity=".12"/><stop offset=".5" stop-color="#5A97C4" stop-opacity=".25"/><stop offset="1" stop-color="#BFD8EA" stop-opacity=".05"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
