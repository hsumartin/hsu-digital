<text x="103" y="645" font-size="18" font-weight="700" fill="#0E1116">The next idea may emerge under different personal conditions.</text>
<text x="103" y="675" font-size="17" fill="#5D6771">Feedback effects can be enabling, limiting, or adverse; long-term AI effects still need to be examined.</text>
