<text x="84" y="276" font-size="23" font-weight="700" fill="#0E1116">Bestehende Idee</text>
<text x="84" y="309" font-size="17" fill="#5D6771">Ziele, Wissen, Interessen</text>
</g>
<g>
<rect x="436" y="199" width="328" height="149" rx="13" fill="#FCFBF8" stroke="#CBD3D7" stroke-width="2"/>
<rect x="436" y="199" width="328" height="6" rx="3" fill="#3F7FAE"/>
<text x="458" y="237" font-size="14" font-weight="700" letter-spacing="1.5" fill="#2B6895">02 / ZUGANG</text>
<text x="458" y="276" font-size="23" font-weight="700" fill="#0E1116">KI-gestützte Erkundung</text>
<text x="458" y="309" font-size="17" fill="#5D6771">Methoden, erste Untersuchungen</text>
</g>
<g>
<rect x="810" y="199" width="328" height="149" rx="13" fill="#FCFBF8" stroke="#CBD3D7" stroke-width="2"/>
<rect x="810" y="199" width="328" height="6" rx="3" fill="#C9A94B"/>
<text x="832" y="237" font-size="14" font-weight="700" letter-spacing="1.5" fill="#2B6895">03 / ERFAHRUNGEN</text>
<text x="832" y="276" font-size="23" font-weight="700" fill="#0E1116">Neue Begegnungen</text>
<text x="832" y="309" font-size="17" fill="#5D6771">Fragen, Ergebnisse, Reflexion</text>
</g>
