<text x="418" y="378" font-size="15" font-weight="700" text-anchor="middle" fill="#2B6895">Möglicher nächster Durchlauf</text>
<!-- caveat -->
<rect x="62" y="610" width="1076" height="96" rx="11" fill="#2B6895" fill-opacity=".07" stroke="#2B6895" stroke-opacity=".23"/>
<rect x="82" y="631" width="4" height="51" fill="#C9A94B"/>
<text x="103" y="645" font-size="18" font-weight="700" fill="#0E1116">Die nächste Idee entsteht möglicherweise unter anderen persönlichen Voraussetzungen.</text>
<text x="103" y="675" font-size="17" fill="#5D6771">Rückkopplungen können förderlich, begrenzt oder nachteilig sein; langfristige KI-Wirkungen bleiben zu prüfen.</text>
<text x="62" y="739" font-size="13" fill="#5D6771">Konzeptionelle Hypothese aus dem Fachartikel · Pfeile visualisieren Möglichkeiten, keine empirisch bestätigten Kausalbeziehungen</text>
</svg>