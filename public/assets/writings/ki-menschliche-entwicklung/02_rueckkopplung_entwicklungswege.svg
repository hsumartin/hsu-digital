<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Mögliche Rückkopplung menschlicher Entwicklung durch KI-gestützte Erfahrungen</title>
<desc id="d">Konzeptionelle Prozessskizze: Individuelle Ausgangssituation, KI-gestützter Zugang und neue Erfahrungen. Die Erfahrung kann Interessen, Verständnis und Perspektiven verändern, wodurch neue Fragen und Entscheidungen entstehen. Eine gestrichelte Rückführung kennzeichnet die mögliche nächste Erkundung unter veränderten Voraussetzungen. Der Verlauf ist hypothetisch, nicht zwingend linear oder positiv.</desc>
<defs><marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" stroke="#2B6895" stroke-width="2" fill="none"/></marker><marker id="arrowgold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" stroke="#C9A94B" stroke-width="2" fill="none"/></marker></defs>
<rect width="1200" height="760" fill="#F0EEE8"/>
<rect x="54" y="48" width="5" height="44" rx="2" fill="#C9A94B"/>
<text x="78" y="66" font-size="16" letter-spacing="3" font-weight="700" fill="#2B6895">ABBILDUNG 02  /  KAPITEL 4</text>
<text x="78" y="104" font-size="31" font-weight="700" fill="#0E1116">Wenn Erfahrungen die nächste Ausgangssituation verändern</text>
<text x="78" y="141" font-size="18" fill="#5D6771">Ein möglicher Entwicklungsverlauf – keine zwangsläufige Wirkung</text>
