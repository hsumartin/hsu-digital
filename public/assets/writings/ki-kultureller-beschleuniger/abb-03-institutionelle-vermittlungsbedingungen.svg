<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">Institutionelle Vermittlungsbedingungen</title>
<desc id="desc">Fünf gleichmässig angeordnete Einflussbereiche um den zentralen Kreis Prüfbare Erkenntnis und kollektive Nutzbarkeit. Zwischen den Kreisrändern besteht überall der gleiche Abstand. Konzeptionelles Modell, keine kausale Wirkungskette.</desc>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7F3"/><stop offset="1" stop-color="#E7ECF0"/></linearGradient>
</defs>
<g font-family="Inter,Arial,Helvetica,sans-serif">

