<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Possible feedback effects in human development through AI-supported experience</title>
<desc id="d">Conceptual process sketch: an initial personal situation, AI-supported exploration, and new experiences. These experiences may change interests, understanding, and perspectives, which can lead to new questions and decisions. A dashed return path marks a possible next exploration under changed conditions. The sequence is hypothetical, not necessarily linear or positive.</desc>
